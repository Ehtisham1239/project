; Place at /etc/supervisor/conf.d/crm-queue.conf on the server, then:
;   supervisorctl reread && supervisorctl update && supervisorctl start crm-queue:*

[program:crm-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/crm-platform/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/crm-platform/storage/logs/queue-worker.log
stopwaitsecs=3600
